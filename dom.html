<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Card</title>
  <link rel="stylesheet" href="dom.css">
</head>
<body>

  <div id="studentCard" class="card">
    <h2 id="studentName">amalkrishna</h2>

    <p>Age: <span id="studentAge">19</span></p>
    <p>Course: <span id="studentCourse">python</span></p>

    <h3>Skills:</h3>
    <ul >
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>

   

    <button id="changeName">Change Name</button>
    <button id="changeCourse">Change Course</button>
    <button id="showDetails">Show Details</button>
    <button id="highlight">Highlight</button>
    <button id="removeHighlight">Remove Highlight</button>
    <button id="toggleTheme">Toggle Theme</button>
    <button id="addSkill">Add Skill</button>
    <button id="removeSkill">Remove Skill</button>
    <button id="replaceSkill">Replace Skill</button>
  </div>

  <script src="dom.js"></script>
</body>
</html>
